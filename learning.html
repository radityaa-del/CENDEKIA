<!-- Menentukan dokumen sebagai HTML5. -->
<!doctype html>
<!-- Deskripsi halaman: learning.html - Antarmuka CENDEKIA untuk bagian learning. -->
<!-- Tag html membungkus seluruh dokumen. Atribut lang="id" memberi informasi bahwa isi utama ditulis dalam Bahasa Indonesia bagi browser dan teknologi aksesibilitas. -->
<html lang="id">
  <!-- Bagian head menyimpan informasi yang tidak ditampilkan langsung sebagai konten utama, tetapi dibutuhkan browser untuk judul, pengkodean karakter, tampilan layar, stylesheet, dan skrip. -->
  <head>
    <!-- Meta memberikan petunjuk teknis kepada browser dan mesin pencari, seperti encoding karakter, ukuran tampilan pada perangkat seluler, atau ringkasan isi halaman. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ruang belajar CENDEKIA." />
    <!-- Title menentukan nama tab dan sering dipakai sebagai identitas halaman pada riwayat browser, bookmark, atau hasil pencarian. -->
    <title>Ruang Belajar | CENDEKIA</title>
    <!-- Link menghubungkan halaman dengan berkas CSS atau layanan font. Perubahan atau kegagalan sumber daya ini dapat memengaruhi tampilan visual halaman. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <!-- Script memuat logika interaksi, autentikasi, data, dan tema. Atribut defer memungkinkan skrip dijalankan setelah struktur HTML siap digunakan. -->
    <script src="js/theme.js" defer></script>
  </head>
  <!-- Body adalah wadah seluruh elemen yang dapat dilihat atau digunakan pengguna, termasuk navigasi, konten, dialog, dan pemberitahuan. -->
  <body class="learning-room" data-auth-required="true">
    <header class="learning-header">
      <!-- Anchor mengubah elemen di dalamnya menjadi tautan. Nilai href menentukan halaman atau bagian situs yang dibuka saat diklik. -->
      <a class="brand" href="dashboard.html">
        <!-- Span membungkus bagian teks atau ikon kecil dalam satu baris. Kelas pada span biasanya digunakan untuk pewarnaan, status, atau bentuk khusus. -->
        <span class="brand-mark">C</span>
        <span>CENDEKIA</span>
      </a>
      <!-- Div adalah wadah generik yang mengelompokkan elemen agar jarak, posisi, dan gaya dapat diatur bersama oleh CSS. -->
      <div class="learning-course-name">
        <small>RUANG BELAJAR</small>
        <!-- Strong memberi penekanan visual dan semantik, sehingga teks tersebut dianggap lebih penting daripada kalimat sekelilingnya. -->
        <strong id="learning-course-title">Python Dasar</strong>
      </div>
      <div class="learning-progress">
        <span id="learning-progress-label">0% selesai</span>
        <div class="progress-track">
          <span id="learning-progress-bar"></span>
        </div>
      </div>
      <a class="back-dashboard" href="dashboard.html">← Dashboard</a>
      <!-- Button digunakan untuk aksi seperti membuka menu, menyimpan, berpindah materi, atau mengirim formulir. Perilakunya ditangani oleh JavaScript. -->
      <button
        class="curriculum-toggle"
        id="curriculum-toggle"
        type="button"
        aria-label="Buka kurikulum"
      >
        ☰
      </button>
    </header>

    <!-- Main menandai bagian isi yang paling penting bagi tujuan halaman. Konten di sini biasanya tidak dipakai ulang sebagai elemen dekorasi atau navigasi. -->
    <main class="learning-layout">
      <!-- Aside menampung informasi pendukung yang melengkapi isi utama, seperti persyaratan kelas, ringkasan, atau rekomendasi berikutnya. -->
      <aside class="curriculum-sidebar" id="curriculum-sidebar">
        <div class="curriculum-heading">
          <!-- Elemen p menyajikan teks sebagai paragraf yang terpisah sehingga alur baca, jarak baris, dan warna dapat diatur konsisten. -->
          <p class="section-kicker">Kurikulum kelas</p>
          <!-- H2 membagi isi menjadi bagian yang lebih spesifik dan membentuk hierarki judul setelah h1. -->
          <h2 id="curriculum-course-title">Python Dasar</h2>
        </div>
        <div id="curriculum-list"></div>
      </aside>

      <!-- Section mengelompokkan isi yang memiliki tema atau tujuan sama, misalnya intro, daftar kelas, formulir, atau ringkasan hasil. -->
      <section class="lesson-area">
        <div class="lesson-breadcrumb">
          <span id="lesson-chapter">Bab 1</span>
          <span>/</span>
          <span id="lesson-position">Materi 1</span>
        </div>
        <!-- Article memuat satu unit konten yang dapat berdiri sendiri dan memiliki makna meskipun dipisahkan dari bagian lainnya. -->
        <article class="lesson-content">
          <div class="lesson-title-row">
            <div>
              <p class="section-kicker">Materi pembelajaran</p>
              <!-- H1 adalah heading paling utama. Teks di dalamnya menjelaskan topik atau tujuan utama halaman bagi pengguna dan mesin pencari. -->
              <h1 id="lesson-title"></h1>
            </div>
            <span class="lesson-status" id="lesson-status">Belum selesai</span>
          </div>
          <div class="lesson-illustration" id="lesson-illustration">
            <span>{ }</span>
            <b>Belajar dengan praktik</b>
          </div>
          <div class="lesson-copy">
            <p id="lesson-explanation"></p>
            <h2>Contoh kode</h2>
            <pre><code id="lesson-code"></code></pre>
            <div class="lesson-summary">
              <strong>Rangkuman materi</strong>
              <p id="lesson-summary"></p>
            </div>
          </div>
        </article>
        <!-- Nav mengelompokkan tautan yang berfungsi mengarahkan pengguna ke halaman lain atau lokasi tertentu. Struktur ini juga membantu navigasi keyboard dan pembaca layar. -->
        <nav class="lesson-navigation" aria-label="Navigasi materi">
          <button class="button button-secondary" id="previous-lesson" type="button">
            ← Sebelumnya
          </button>
          <button class="button button-primary" id="complete-lesson" type="button">
            Tandai selesai <span>✓</span>
          </button>
          <button class="button button-primary" id="next-lesson" type="button">
            Materi berikutnya <span>→</span>
          </button>
        </nav>
      </section>
    </main>
    <div class="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth-session.js"></script>
    <script src="js/learning-data.js"></script>
    <script src="js/progress-store.js"></script>
    <script src="js/learning.js"></script>
  </body>
</html>
