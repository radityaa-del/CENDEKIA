<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Atur ulang password akun CENDEKIA.">
  <title>Atur Ulang Password | CENDEKIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabase-config.js" defer></script>
  <script src="js/supabase-client.js" defer></script>
  <script src="js/password-reset.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar container" aria-label="Navigasi utama">
      <a class="brand" href="index.html"><span class="brand-mark">C</span><span>CENDEKIA</span></a>
    </nav>
  </header>
  <main class="container auth-page">
    <section class="auth-intro">
      <p class="section-kicker">Pemulihan akun</p>
      <h1>Buat password baru <em>yang aman.</em></h1>
      <p>Pilih password baru yang unik dan tidak digunakan untuk akun lain.</p>
    </section>
    <section class="auth-form-card" aria-labelledby="reset-title">
      <h2 id="reset-title">Atur ulang password</h2>
      <p class="form-subtitle" id="reset-status" role="status">Memeriksa tautan pemulihan...</p>
      <form class="auth-form hidden" id="reset-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="new-password">Password baru</label>
          <div class="password-wrap">
            <input class="form-input" id="new-password" name="password" type="password" autocomplete="new-password" placeholder="Minimal 8 karakter" required>
            <button class="password-toggle" type="button" data-target="new-password" aria-label="Tampilkan password">Tampilkan</button>
          </div>
          <span class="field-error" data-error-for="password"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm-password">Konfirmasi password baru</label>
          <div class="password-wrap">
            <input class="form-input" id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Ulangi password baru" required>
            <button class="password-toggle" type="button" data-target="confirm-password" aria-label="Tampilkan password">Tampilkan</button>
          </div>
          <span class="field-error" data-error-for="confirmPassword"></span>
        </div>
        <button class="button button-primary form-submit" type="submit">Simpan password baru</button>
      </form>
      <p class="form-footnote"><a href="login.html">Kembali ke halaman masuk</a></p>
    </section>
  </main>
  <div class="toast" role="status" aria-live="polite"></div>
</body>
</html>
